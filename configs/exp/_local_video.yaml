# Video A/B runs on a 6 GB GPU: 50M-parameter model, visual front-end
# initialised from the Auto-AVSR LRS3 model, everything trainable so that
# input-side changes (crop, masking) can take effect.
model:
  modality: video
  adim: 256
  aheads: 4
  eunits: 2048
  elayers: 12
  dunits: 2048
  dlayers: 6
  pretrained:
    path: pretrained/vsr_trlrs2lrs3vox2avsp_base.pth
    scope: frontend
tokenizer:
  vocab_size: 500
  model_path: dataset/tr-lrs-v3-tokenizer/unigram500.model
data:
  max_frames_per_clip: 300
  max_frames_per_batch: 1200
  max_batch_size: 32
  num_workers: 6
train:
  max_epochs: 12
  warmup_epochs: 2
  save_top_k: 1
