# Fine-tuning an audio-visual (lips and sound) model on TR-LRS.
#
# The model is the audio-visual one of Auto-AVSR (Ma et al., ICASSP 2023):
# a video stream (3D convolution and ResNet-18 front-end, 12 Conformer
# blocks of width 768) and an audio stream (1D ResNet-18 front-end, 12
# Conformer blocks), whose outputs are concatenated and merged by an MLP
# with 8192 hidden units, then one decoder of 6 blocks. 435M parameters.
#
# Auto-AVSR publishes no audio-visual checkpoint, so each stream starts from
# the checkpoint of its own modality:
#   video stream and decoder: vsr_trlrs2lrs3vox2avsp_base.pth (3,291 h),
#     the starting point of training/configs/finetune/vsr_base.yaml
#   audio stream: asr_trlrs3vox2_base.pth (1,759 h, 1.0 % WER on LRS3),
#     the starting point of training/configs/finetune/asr_base.yaml
# The fusion MLP, the token embedding and the two output layers start from
# random values and use the high learning rate.
#
# Everything else is the recipe of vsr_base.yaml, so that the two runs can
# be compared. Babble noise is mixed into the audio during training
# (augment.audio.noise, -5 to 20 dB or clean), as in Auto-AVSR.
#
#   python training/train.py -c training/configs/finetune/avsr_base.yaml exp_name=avsr_finetune

model:
  modality: audiovisual
  adim: 768
  aheads: 12
  eunits: 3072
  elayers: 12
  dunits: 3072
  dlayers: 6
  ctc_weight: 0.1
  label_smoothing: 0.1
  # As in Auto-AVSR. false reproduces its encoder exactly; true keeps padded
  # frames out of the convolutions (see docs/findings.md).
  mask_conv_padding: true
  fusion:
    type: late_mlp
    hidden: 8192
  pretrained:
    path: pretrained/vsr_trlrs2lrs3vox2avsp_base.pth
    audio_path: pretrained/asr_trlrs3vox2_base.pth
    scope: full
  freeze: none

tokenizer:
  type: unigram
  vocab_size: 1000
  model_path: dataset/tr-lrs-v3-tokenizer/unigram1000.model

data:
  root: dataset/tr-lrs-v3
  manifests: dataset/tr-lrs-v3-manifests
  ptm_in_clips: false
  max_frames_per_clip: 300
  # 1800 frames per batch is the Auto-AVSR value. The two streams need about
  # twice the memory of the video model: measure what the GPU holds with
  # training/benchmark_memory.py and keep (frames per batch) x
  # (accumulate_grad_batches) near 1800.
  max_frames_per_batch: 1800
  max_batch_size: 64
  num_workers: 12

train:
  max_epochs: 75
  warmup_epochs: 5
  # Learning rate of the new layers. The pretrained parts use
  # lr x pretrained_lr_scale = 2e-5.
  lr: 1.0e-3
  pretrained_lr_scale: 0.02
  hold_pretrained_epochs: 1
  weight_decay: 0.03
  grad_clip: 10.0
  accumulate_grad_batches: 1
  precision: 16-mixed
  save_top_k: 10
  # last.ckpt also every 20 minutes, so that an interrupted server loses
  # little (training/vast/backup.sh copies it to the local machine).
  checkpoint_every_minutes: 20
  # Every batch uses both inputs. [0.25, 0, 0.75] would also train on
  # video-only batches (the audio stream fed zeros), so that the same model
  # reads lips without sound; validation then reports all three modes.
  input_mode_probs: [0.0, 0.0, 1.0]
